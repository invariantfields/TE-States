[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "te-states"
version = "0.1.0"
description = "N-Qubit State Optimization & Stabilizer Rényi Entropy (SRE) Trajectory Generator"
readme = "README.md"
requires-python = ">=3.12"

# ── Base dependencies (CPU mode works out-of-the-box) ────────────────────────
dependencies = [
    "marimo>=0.10.0",
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0", # Required for generate_plots.py
    "jax>=0.4.30",       # CPU backend; GPU variants installed via extras below
    "jaxopt>=0.8.5",
]

[tool.setuptools]
py-modules = ["Generate_States"]

# ── Optional GPU extras ──────────────────────────────────────────────────────
# Install the block that matches your installed CUDA toolkit.
[project.optional-dependencies]

# LP Bounds / SageMath Jupyter Notebooks
# Install with:  pip install ".[lp]"
lp = [
    "jupyter>=1.0.0",
]

# Exploratory analysis: Absolute_Entanglement.ipynb and AAME.py
# Install with:  pip install ".[explore]"
# Also needs `qgeo` (not on PyPI, see README) and a MOSEK licence.
explore = [
    "jupyter>=1.0.0",
    "picos>=2.4",
    "cvxopt>=1.3",
    "mosek>=10.0",
    "ncpol2sdpa>=1.12",
    "sympy>=1.12",
    "torch>=2.2",
    "pandas>=2.0",
    "networkx>=3.0",
]

# CUDA 12 — RTX 30xx / 40xx, A100, H100 with CUDA 12 toolkit
# Install with:  pip install ".[cuda12]"
cuda12 = [
    "cupy-cuda12x>=13.0.0",   # CuPy wheel built against CUDA 12.x
    "jax[cuda12]>=0.4.30",    # JAX with CUDA 12 XLA backend
    "nvidia-curand-cu12",     # Required for CuPy random number generation (curand)
]

# CUDA 13 — RTX 50xx, H100 / H200 with CUDA 13 toolkit
# Install with:  pip install ".[cuda13]"
cuda13 = [
    "cupy-cuda13x>=14.0.0",   # CuPy wheel built against CUDA 13.x
    "jax[cuda13]>=0.4.30",    # JAX with CUDA 13 XLA backend
    "nvidia-curand-cu13",     # Required for CuPy random number generation (curand)
]

# Development tooling (linting)
# Install with:  pip install ".[dev]"
dev = [
    "ruff>=0.4.0",            # Fast Python linter / formatter
]
