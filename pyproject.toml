[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "te-states"
version = "0.1.0"
description = "N-Qubit State Optimization & Stabilizer Rényi Entropy (SRE) Trajectory Generator"
readme = "README.md"
requires-python = ">=3.12"

# ── CPU-only base dependencies ───────────────────────────────────────────────
# Sufficient to run Generate_States_cpu.py (JAX on CPU + NumPy SRE).
# No CUDA drivers or GPU hardware required.
dependencies = [
    "marimo>=0.10.0",
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "jax>=0.4.30",       # CPU backend; GPU variants installed via extras below
    "jaxopt>=0.8.5",
]

# ── Optional GPU extras ──────────────────────────────────────────────────────
# Install the block that matches your installed CUDA toolkit.
# Check your CUDA version with:  nvcc --version
[project.optional-dependencies]

# CUDA 12 — RTX 30xx / 40xx, A100, H100 with CUDA 12 toolkit
# Install with:  pip install ".[gpu-cuda12]"
gpu-cuda12 = [
    "cupy-cuda12x>=13.0.0",   # CuPy wheel built against CUDA 12.x
    "jax[cuda12]>=0.4.30",    # JAX with CUDA 12 XLA backend
]

# CUDA 13 — RTX 50xx, H100 / H200 with CUDA 13 toolkit
# Install with:  pip install ".[gpu-cuda13]"
gpu-cuda13 = [
    "cupy-cuda13x>=14.0.0",   # CuPy wheel built against CUDA 13.x
    "jax[cuda13]>=0.4.30",    # JAX with CUDA 13 XLA backend
]

# Development tooling (linting, notebook export)
# Install with:  pip install ".[dev]"
dev = [
    "nbformat>=5.9.0",        # Required for `marimo export ipynb`
    "ruff>=0.4.0",            # Fast Python linter / formatter
]

# ── Quick-reference ──────────────────────────────────────────────────────────
#
#   Notebook                    Deps needed        Run command
#   ─────────────────────────── ────────────────── ─────────────────────────────
#   Generate_States_cpu.py      (base only)        uv run Generate_States_cpu.py
#   Generate_States.py          [gpu-cuda12] OR    uv run Generate_States.py
#                               [gpu-cuda13]
